{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multica.postgresql.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    {{- include "multica.postgresql.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.postgresql.type }}
  ports:
    - port: {{ .Values.service.postgresql.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "multica.postgresql.selectorLabels" . | nindent 4 }}
{{- end }}
