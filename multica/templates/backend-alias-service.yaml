# The prebuilt web image has REMOTE_API_URL=http://backend:8080 baked in at
# build time (standalone Next.js output). This alias Service lets the frontend
# pod resolve "backend" to the multica-backend ClusterIP without a custom image build.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "multica.backend.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
