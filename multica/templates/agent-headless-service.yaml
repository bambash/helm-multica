{{- range $name, $agent := .Values.agents }}
{{- if $agent.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multica.fullname" $ }}-agent-{{ $name }}
  labels:
    {{- include "multica.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent
    multica.ai/agent-type: {{ $agent.type }}
spec:
  clusterIP: None
  selector:
    {{- include "multica.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: agent
    multica.ai/agent-type: {{ $agent.type }}
  ports:
    - name: placeholder
      port: 80
      protocol: TCP
{{- end }}
{{- end }}
