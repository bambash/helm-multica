{{- range $name, $agent := .Values.agents }}
{{- if $agent.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "multica.fullname" $ }}-agent-{{ $name }}
  labels:
    {{- include "multica.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent
    multica.ai/agent-type: {{ $agent.type }}
spec:
  serviceName: {{ include "multica.fullname" $ }}-agent-{{ $name }}
  replicas: {{ $agent.replicas | default 1 }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "multica.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: agent
      multica.ai/agent-type: {{ $agent.type }}
  template:
    metadata:
      labels:
        {{- include "multica.labels" $ | nindent 8 }}
        app.kubernetes.io/component: agent
        multica.ai/agent-type: {{ $agent.type }}
    spec:
      serviceAccountName: {{ if $agent.serviceAccount }}{{ $agent.serviceAccount.name }}{{ else }}claude{{ end }}
      terminationGracePeriodSeconds: {{ $agent.terminationGracePeriodSeconds | default 120 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ $agent.image.repository }}:{{ $agent.image.tag }}
          imagePullPolicy: {{ $agent.image.pullPolicy | default "Always" }}
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MULTICA_SERVER_URL
              value: {{ $agent.serverUrl | default "http://multica-backend:8080" | quote }}
            - name: MULTICA_AGENT_TYPE
              value: {{ $agent.type | quote }}
            - name: MULTICA_WORKSPACES_ROOT
              value: {{ $agent.workspacesRoot | default "/workspace/multica_workspaces" | quote }}
            - name: MULTICA_DAEMON_POLL_INTERVAL
              value: {{ $agent.pollInterval | default "3s" | quote }}
            - name: MULTICA_DAEMON_HEARTBEAT_INTERVAL
              value: {{ $agent.heartbeatInterval | default "15s" | quote }}
            - name: MULTICA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: multica-agent-pat
                  key: token
          {{- if eq $agent.type "claude" }}
          envFrom:
            - secretRef:
                name: multica-deepseek-env
          {{- end }}
          resources:
            {{- toYaml ($agent.resources | default $.Values.agents.defaultResources) | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: agent-home
              mountPath: /home/agent
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $agent.persistence.storageClass }}
        storageClassName: {{ $agent.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $agent.persistence.workspaceSize | default "30Gi" }}
    - metadata:
        name: agent-home
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $agent.persistence.storageClass }}
        storageClassName: {{ $agent.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $agent.persistence.homeSize | default "5Gi" }}
{{- end }}
{{- end }}
