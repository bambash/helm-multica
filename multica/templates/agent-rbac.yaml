{{- range $name, $agent := .Values.agents }}
{{- if and $agent.enabled $agent.serviceAccount $agent.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required (printf "agents.%s.serviceAccount.name is required when serviceAccount.create is true" $name) $agent.serviceAccount.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "multica.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent
{{- if $agent.serviceAccount.clusterRoleBinding }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $agent.serviceAccount.name }}
  labels:
    {{- include "multica.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $agent.serviceAccount.clusterRoleBinding.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $agent.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
