apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multica.fullname" . }}-secret
  labels:
    {{- include "multica.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.existingSecret }}
  {{- else }}
  jwt-secret: {{ include "multica.jwtSecret" . | quote }}
  {{- end }}
  {{- if .Values.backend.resend.apiKey }}
  resend-api-key: {{ .Values.backend.resend.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.googleOAuth.clientSecret }}
  google-client-secret: {{ .Values.backend.googleOAuth.clientSecret | quote }}
  {{- end }}
  {{- if .Values.backend.cloudfront.privateKey }}
  cloudfront-private-key: {{ .Values.backend.cloudfront.privateKey | quote }}
  {{- end }}
  {{- if .Values.backend.github.webhookSecret }}
  github-webhook-secret: {{ .Values.backend.github.webhookSecret | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  {{- $pgPassword := or .Values.postgresql.auth.password (randAlphaNum 16) }}
  database-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.postgresql.auth.username $pgPassword (include "multica.postgresql.fullname" .) 5432 .Values.postgresql.auth.database | quote }}
  postgres-password: {{ $pgPassword | quote }}
  {{- else if not .Values.externalDatabase.existingSecret }}
  database-url: {{ include "multica.databaseUrl" . | quote }}
  {{- end }}
