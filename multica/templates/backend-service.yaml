apiVersion: v1
kind: Service
metadata:
  name: {{ include "multica.backend.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    {{- include "multica.backend.selectorLabels" . | nindent 4 }}
  {{- with .Values.service.backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.backend.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.service.backend.nodePort }}
      nodePort: {{ .Values.service.backend.nodePort }}
      {{- end }}
    {{- if .Values.backend.metricsAddr }}
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "multica.backend.selectorLabels" . | nindent 4 }}
