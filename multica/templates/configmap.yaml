apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multica.fullname" . }}-config
  labels:
    {{- include "multica.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.backend.appEnv | quote }}
  {{- if .Values.backend.devVerificationCode }}
  MULTICA_DEV_VERIFICATION_CODE: {{ .Values.backend.devVerificationCode | quote }}
  {{- end }}
  PORT: {{ .Values.service.backend.port | quote }}
  FRONTEND_PORT: {{ .Values.service.frontend.port | quote }}
  FRONTEND_ORIGIN: {{ include "multica.frontendOrigin" . | quote }}
  {{- if .Values.backend.allowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.allowedOrigins | quote }}
  {{- end }}
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
  {{- if .Values.backend.metricsAddr }}
  METRICS_ADDR: {{ .Values.backend.metricsAddr | quote }}
  {{- end }}
  {{- if .Values.backend.realtimeMetricsToken }}
  REALTIME_METRICS_TOKEN: {{ .Values.backend.realtimeMetricsToken | quote }}
  {{- end }}
  {{- if .Values.backend.resend.fromEmail }}
  RESEND_FROM_EMAIL: {{ .Values.backend.resend.fromEmail | quote }}
  {{- end }}
  {{- if .Values.backend.googleOAuth.clientId }}
  GOOGLE_CLIENT_ID: {{ .Values.backend.googleOAuth.clientId | quote }}
  {{- end }}
  {{- if .Values.backend.googleOAuth.redirectUri }}
  GOOGLE_REDIRECT_URI: {{ .Values.backend.googleOAuth.redirectUri | quote }}
  {{- end }}
  {{- if .Values.backend.s3.bucket }}
  S3_BUCKET: {{ .Values.backend.s3.bucket | quote }}
  {{- end }}
  {{- if .Values.backend.s3.region }}
  S3_REGION: {{ .Values.backend.s3.region | quote }}
  {{- end }}
  {{- if .Values.backend.cloudfront.domain }}
  CLOUDFRONT_DOMAIN: {{ .Values.backend.cloudfront.domain | quote }}
  {{- end }}
  {{- if .Values.backend.cloudfront.keyPairId }}
  CLOUDFRONT_KEY_PAIR_ID: {{ .Values.backend.cloudfront.keyPairId | quote }}
  {{- end }}
  ALLOW_SIGNUP: {{ .Values.backend.allowSignup | quote }}
  {{- if .Values.backend.allowedEmailDomains }}
  ALLOWED_EMAIL_DOMAINS: {{ .Values.backend.allowedEmailDomains | quote }}
  {{- end }}
  {{- if .Values.backend.allowedEmails }}
  ALLOWED_EMAILS: {{ .Values.backend.allowedEmails | quote }}
  {{- end }}
  {{- if .Values.backend.cookieDomain }}
  COOKIE_DOMAIN: {{ .Values.backend.cookieDomain | quote }}
  {{- end }}
  MULTICA_APP_URL: {{ include "multica.frontendOrigin" . | quote }}
  {{- if .Values.backend.github.appSlug }}
  GITHUB_APP_SLUG: {{ .Values.backend.github.appSlug | quote }}
  {{- end }}
  {{- if .Values.frontend.wsUrl }}
  NEXT_PUBLIC_WS_URL: {{ .Values.frontend.wsUrl | quote }}
  {{- end }}
