{{- if .Values.agentSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "multica.fullname" . }}-agent-setup
  labels:
    {{- include "multica.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.6.0
          env:
            - name: MULTICA_SERVER_URL
              value: {{ .Values.agentSetup.serverUrl | default "http://multica-backend:8080" | quote }}
            - name: MULTICA_PAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: multica-agent-pat
                  key: token
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BASE="${MULTICA_SERVER_URL}"
              AUTH="Authorization: Bearer ${MULTICA_PAT_TOKEN}"

              echo "==> Fetching workspaces..."
              WORKSPACES=$(curl -sf -H "$AUTH" "${BASE}/api/workspaces")
              WORKSPACE_ID=$(echo "$WORKSPACES" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "Workspace: $WORKSPACE_ID"

              echo "==> Waiting for claude runtime to register..."
              RUNTIME_ID=""
              for i in $(seq 1 30); do
                RUNTIMES=$(curl -sf -H "$AUTH" "${BASE}/api/runtimes/" || echo "{}")
                RUNTIME_ID=$(echo "$RUNTIMES" | grep -B2 '"provider":"claude"' | grep '"id"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')
                [ -n "$RUNTIME_ID" ] && break
                echo "  attempt $i/30, waiting 10s..."
                sleep 10
              done

              if [ -z "$RUNTIME_ID" ]; then
                echo "ERROR: claude runtime never registered"
                exit 1
              fi
              echo "Runtime ID: $RUNTIME_ID"

              {{- range .Values.agentSetup.skills }}
              echo "==> Importing skill: {{ .name }}"
              curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
                -d '{"url":"{{ .url }}"}' \
                "${BASE}/api/skills/import" \
                && echo "  OK" || echo "  WARN: import failed (may already exist)"
              {{- end }}

              {{- range .Values.agentSetup.personas }}
              {{- if eq .runtimeType "claude" }}
              echo "==> Creating persona: {{ .name }}"
              curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"name\":\"{{ .name }}\",\"description\":\"{{ .description }}\",\"instructions\":\"{{ .instructions | replace "\n" "\\n" | replace "\"" "\\\"" }}\",\"runtime_id\":\"${RUNTIME_ID}\",\"workspace_id\":\"${WORKSPACE_ID}\"}" \
                "${BASE}/api/agents" \
                && echo "  OK" || echo "  WARN: persona creation failed"
              {{- end }}
              {{- end }}

              echo "==> Setup complete."
{{- end }}
