# =============================================================================
# Multica Helm Chart — Default Values
# =============================================================================

# -- Override the release name (used for resource name prefix)
nameOverride: ""
# -- Override the full name (used for resource names throughout)
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Image configuration
# ---------------------------------------------------------------------------
image:
  backend:
    repository: ghcr.io/multica-ai/multica-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/multica-ai/multica-web
    tag: latest
    pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Replica counts
# ---------------------------------------------------------------------------
replicaCount:
  backend: 1
  frontend: 1

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Annotations applied to all pods
podAnnotations: {}
# -- Labels applied to all pods
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}
  # fsGroup: 1001

# -- Container-level security context
securityContext:
  backend:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  frontend:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  postgresql:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Service configuration
# ---------------------------------------------------------------------------
service:
  backend:
    type: ClusterIP
    port: 8080
    # -- Optional nodePort if type is NodePort
    nodePort: null
    annotations: {}
  frontend:
    type: ClusterIP
    port: 3000
    # -- Optional nodePort if type is NodePort
    nodePort: null
    annotations: {}
  postgresql:
    type: ClusterIP
    port: 5432

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  # -- Ingress class name (e.g. nginx, traefik, contour)
  className: ""
  # -- Annotations applied to the Ingress resource
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
  # -- Use separate hosts for frontend and backend (api.* + app.*).
  # When false, all traffic goes through the frontend service on a single host
  # and Next.js rewrites proxy API calls internally. WebSocket connections
  # are routed directly to the backend via /ws path.
  separateHosts:
    enabled: false
    # -- Frontend hostname (e.g. app.example.com)
    frontendHost: ""
    # -- Backend API hostname (e.g. api.example.com)
    backendHost: ""
  hosts:
    - host: multica.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: multica-tls
  #    hosts:
  #      - multica.example.com

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  backend:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  frontend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  postgresql:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---------------------------------------------------------------------------
# Autoscaling (backend only)
# ---------------------------------------------------------------------------
autoscaling:
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1

# ---------------------------------------------------------------------------
# Node selection
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Built-in PostgreSQL
# ---------------------------------------------------------------------------
postgresql:
  # -- Deploy a PostgreSQL instance inside the cluster.
  # Set to false and configure externalDatabase for production use.
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg17
    pullPolicy: IfNotPresent
  auth:
    database: multica
    username: multica
    # -- Password is auto-generated if left empty. Use a Secret for production.
    password: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

# ---------------------------------------------------------------------------
# External database (used when postgresql.enabled is false)
# ---------------------------------------------------------------------------
externalDatabase:
  # -- Full DSN overrides all other fields when set.
  url: ""
  host: ""
  port: 5432
  database: multica
  username: multica
  password: ""
  sslmode: require
  # -- Name of an existing Secret that contains the database URL under key
  # "database-url". Takes precedence over host/port/etc.
  existingSecret: ""

# ---------------------------------------------------------------------------
# Backend application configuration
# ---------------------------------------------------------------------------
backend:
  # -- JWT secret for signing tokens. Auto-generated if left empty.
  # Override with a fixed value for stable sessions across restarts.
  jwtSecret: ""
  # -- Existing Secret containing "jwt-secret" key. Takes precedence over jwtSecret.
  existingSecret: ""

  # -- Application environment. Set to "production" for security hardening.
  appEnv: production

  # -- Dev verification code (ignored when appEnv is production).
  # Only set for private test instances.
  devVerificationCode: ""

  # -- Metrics listener address. Empty disables Prometheus metrics.
  # Bind to loopback only; protect with private networking in production.
  # Example: "0.0.0.0:9090"
  metricsAddr: ""

  # -- Log level: debug, info, warn, error
  logLevel: info

  # -- Realtime metrics endpoint access token (protects /health/realtime).
  # Required when behind a reverse proxy. Pass as Authorization: Bearer <token>.
  realtimeMetricsToken: ""

  # -----------------------------------------------------------------------
  # Email (Resend) — required for authentication in production
  # -----------------------------------------------------------------------
  resend:
    # -- Resend API key. Leave empty for dev (codes printed to backend logs).
    apiKey: ""
    # -- Sender email address (must be verified in Resend).
    fromEmail: "noreply@multica.ai"
    # -- Existing Secret containing "resend-api-key" key.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # Google OAuth (optional)
  # -----------------------------------------------------------------------
  googleOAuth:
    clientId: ""
    clientSecret: ""
    redirectUri: ""
    # -- Existing Secret containing "google-client-secret" key.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # S3 / CloudFront file storage (optional)
  # -----------------------------------------------------------------------
  s3:
    bucket: ""
    region: us-west-2
  cloudfront:
    domain: ""
    keyPairId: ""
    privateKey: ""
    # -- Existing Secret containing "cloudfront-private-key" key.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # Signup controls
  # -----------------------------------------------------------------------
  allowSignup: true
  # -- Comma-separated list of allowed email domains
  allowedEmailDomains: ""
  # -- Comma-separated list of allowed email addresses
  allowedEmails: ""

  # -----------------------------------------------------------------------
  # Cookie
  # -----------------------------------------------------------------------
  # -- Cookie Domain attribute. Leave empty for single-host deployments.
  # Only set when frontend/backend are on different subdomains of the same
  # registered domain (e.g. ".example.com"). Do NOT use an IP address.
  cookieDomain: ""

  # -----------------------------------------------------------------------
  # Allowed origins (CORS + WebSocket)
  # -----------------------------------------------------------------------
  # -- Comma-separated list of allowed origins. Defaults to frontend origin
  # when empty.
  allowedOrigins: ""

  # -----------------------------------------------------------------------
  # GitHub App integration (optional)
  # -----------------------------------------------------------------------
  github:
    appSlug: ""
    webhookSecret: ""
    # -- Existing Secret containing "github-webhook-secret" key.
    existingSecret: ""

  # -----------------------------------------------------------------------
  # Upload persistence
  # -----------------------------------------------------------------------
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

# ---------------------------------------------------------------------------
# Frontend configuration
# ---------------------------------------------------------------------------
frontend:
  # -- Public origin where the frontend is accessed.
  # Auto-derived from ingress when empty.
  origin: ""

  # -- WebSocket URL override (build-time value baked into the image).
  # Only set if you are building a custom web image. The recommended approach
  # is to route /ws at the ingress/reverse-proxy layer instead.
  wsUrl: ""

# ---------------------------------------------------------------------------
# Prometheus ServiceMonitor
# ---------------------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false
    # -- Additional labels for the ServiceMonitor
    labels: {}
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s

# ---------------------------------------------------------------------------
# Agent runtimes (StatefulSets — one per AI tool)
# ---------------------------------------------------------------------------
# Optional serviceAccount block (per agent). If omitted, the pod uses the
# 'claude' SA (existing cluster default). Schema:
#
#   serviceAccount:
#     create: true              # creates the SA in the release namespace
#     name: multica-my-agent   # SA name used by the pod and in the CRB
#     clusterRoleBinding:       # omit entirely — no ClusterRoleBinding created
#       clusterRole: cluster-admin
agents:
  defaultResources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

  claude:
    enabled: false
    type: claude
    replicas: 1
    image:
      repository: ghcr.io/bambash/multica-agent
      tag: latest
      pullPolicy: Always
    serverUrl: "http://multica-backend:8080"
    workspacesRoot: /workspace/multica_workspaces
    pollInterval: "3s"
    heartbeatInterval: "15s"
    terminationGracePeriodSeconds: 120
    persistence:
      storageClass: ""
      workspaceSize: 30Gi
      homeSize: 5Gi

  copilot:
    enabled: false
    type: copilot
    replicas: 1
    image:
      repository: ghcr.io/bambash/multica-agent
      tag: latest
      pullPolicy: Always
    serverUrl: "http://multica-backend:8080"
    workspacesRoot: /workspace/multica_workspaces
    pollInterval: "3s"
    heartbeatInterval: "15s"
    terminationGracePeriodSeconds: 120
    persistence:
      storageClass: ""
      workspaceSize: 20Gi
      homeSize: 5Gi

# ---------------------------------------------------------------------------
# Agent setup job (PostSync hook — creates personas and imports skills)
# ---------------------------------------------------------------------------
agentSetup:
  enabled: false
  serverUrl: "http://multica-backend:8080"
  skills:
    - name: frontend-design
      url: "https://github.com/anthropics/claude-code/tree/main/skills/frontend-design"
    - name: test-driven-development
      url: "https://github.com/anthropics/claude-code/tree/main/skills/test-driven-development"
    - name: using-multica
      url: "https://github.com/bambash/multica-agent-image/tree/main/skills/using-multica"
  personas:
    - name: "Backend Developer"
      runtimeType: claude
      description: "Expert backend developer focused on APIs and system design"
      instructions: "You are an expert backend developer. Focus on clean APIs, robust error handling, and well-tested code. Always review existing patterns before introducing new abstractions. Prefer Go and Python."
    - name: "Frontend Developer"
      runtimeType: claude
      description: "Expert frontend developer focused on React and UX"
      instructions: "You are an expert frontend developer. Build accessible, performant UIs with React and TypeScript. Follow the existing design system and component library."
    - name: "Product Manager"
      runtimeType: claude
      description: "Strategic PM who writes clear specs and acceptance criteria"
      instructions: "You are a product manager. Help define requirements, write user stories, and clarify acceptance criteria. Keep responses concise and actionable."
    - name: "DevOps Engineer"
      runtimeType: claude
      description: "Infrastructure and CI/CD specialist"
      instructions: "You are a DevOps engineer. Focus on Kubernetes, Helm, GitOps (ArgoCD), and CI/CD pipelines. Prefer declarative infrastructure. Always dry-run before applying."
    - name: "Code Reviewer"
      runtimeType: claude
      description: "Thorough code reviewer focused on correctness and maintainability"
      instructions: "You are a code reviewer. Review for correctness, security, performance, and maintainability. Be specific about what to change and why."
    - name: "Kubernetes Administrator"
      runtimeType: claude
      description: "Expert Kubernetes admin for bare-metal kubeadm cluster operations, workload design, and production reliability"
      instructions: "You are an expert Kubernetes administrator with deep operational experience managing production clusters. Prioritize cluster stability, security, and observability in every decision. Before making changes, describe the intended change and its blast radius. Use --dry-run to validate manifests first. Set explicit resource requests and limits, include liveness and readiness probes, use RollingUpdate strategy, never use latest image tags. Always helm diff before helm upgrade. For destructive operations require explicit confirmation."
    - name: "Business Analyst"
      runtimeType: claude
      description: "Refines task descriptions and creates measurable acceptance criteria for implementation tasks"
      instructions: "You are a senior business analyst who transforms vague requirements into clear, actionable specifications with measurable acceptance criteria. Focus on WHAT and WHY, not HOW — no implementation details. Distinguish business needs from proposed solutions. Ensure every criterion is specific, measurable, technology-agnostic, user-focused, and testable. Document scope boundaries explicitly. Cover happy path, edge cases, and error scenarios."
    - name: "Code Explorer"
      runtimeType: claude
      description: "Analyzes codebase features, traces execution paths, and maps all files affected by proposed changes"
      instructions: "You are an expert code analyst specializing in tracing feature implementations across codebases, mapping architecture layers, and identifying all files affected by proposed changes. Provide thorough, verified analysis — never superficial or single-file analysis. Identify every affected file, interface, function, and integration point. Use THOUGHT/ACTION/OBSERVATION reasoning to document your exploration systematically."
    - name: "Developer"
      runtimeType: claude
      description: "Implements tasks from specifications into production-ready code following acceptance criteria"
      instructions: "You are a senior software engineer who transforms task specifications into production-ready code. Follow acceptance criteria precisely, reuse existing codebase patterns, and ensure all tests pass before marking work complete. Never hallucinate APIs or submit untested code. Perform a self-critique loop before declaring any implementation done."
    - name: "QA Engineer"
      runtimeType: claude
      description: "Designs LLM-as-Judge verification rubrics and quality gates for implementation steps"
      instructions: "You are a QA engineer who ensures implementation quality through systematic verification design. Analyze implementation artifacts and define verification sections with custom rubrics, weighted criteria, pass/fail thresholds, and execution patterns. Every implementation step must be verifiable — missing verifications mean undetected bugs."
    - name: "Researcher"
      runtimeType: claude
      description: "Investigates unknown technologies and dependencies, producing reusable knowledge artifacts"
      instructions: "You are an expert technical researcher who transforms unknown territories into actionable knowledge by systematically investigating technologies, libraries, and frameworks. Produce reusable skill documents from research findings that all agents can reference. Verify all claims against primary sources — never submit unverified or superficial research."
    - name: "Software Architect"
      runtimeType: claude
      description: "Synthesizes research and requirements into complete, actionable architectural blueprints"
      instructions: "You are a senior software architect who delivers comprehensive, decisive architectural blueprints. Synthesize research findings, codebase analysis, and business requirements into solutions with no ambiguity. Vague blueprints cause implementation disaster — every design decision must be explicit and justified. Read and analyze all available context before making architectural recommendations."
    - name: "Team Lead"
      runtimeType: claude
      description: "Transforms sequential implementation plans into parallelized execution plans with dependency tracking"
      instructions: "You are a team lead who transforms sequential implementation plans into parallelized execution plans. Analyze step dependencies, identify parallel opportunities, assign appropriate agent types to each step, and eliminate sequential bottlenecks without breaking dependency constraints. Deliver optimized, unambiguous execution plans."
    - name: "Tech Lead"
      runtimeType: claude
      description: "Breaks architecture blueprints into ordered implementation steps with success criteria and risk assessment"
      instructions: "You are a technical lead who transforms architecture blueprints into executable task sequences. Apply agile principles and test-driven development to produce ordered steps with subtasks, success criteria, dependency chains, blockers, and risk assessments. Vague task descriptions block teams — every step must be actionable and unambiguous."
    - name: "Technical Writer"
      runtimeType: claude
      description: "Creates and maintains comprehensive, accessible technical documentation for users and developers"
      instructions: "You are a technical documentation specialist who transforms complex technical concepts into clear, structured documentation. Analyze your target audience before writing — documentation must match reader knowledge and goals. Organize content for scannability and progressive disclosure. Cover prerequisites, step-by-step procedures, expected outcomes, troubleshooting, and reference material as appropriate."
